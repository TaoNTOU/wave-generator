<!doctype html>
<html lang="zh-Hant">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>海洋工程工具箱 | Ocean Engineering Toolbox</title>

  <style>
    :root {
      --ink: #17212b;
      --muted: #637083;
      --line: #d8e0ea;
      --panel: #ffffff;
      --bg: #f5f7fa;
      --accent: #0e7a8a;
      --accent-dark: #095c68;

      font-family: "Segoe UI", "Noto Sans TC", "Microsoft JhengHei", system-ui, sans-serif;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: var(--bg);
      color: var(--ink);
    }

    main {
      width: min(1320px, calc(100% - 28px));
      margin: 0 auto;
      padding: 24px 0 32px;
    }

    header {
      margin-bottom: 18px;
    }

    h1 {
      margin: 0 0 6px;
      font-size: clamp(1.8rem, 3vw, 2.8rem);
      line-height: 1.05;
    }

    .subtitle {
      margin: 0;
      color: var(--muted);
    }

    .layout {
      display: grid;
      grid-template-columns: 290px 1fr;
      gap: 16px;
      align-items: start;
    }

    .panel {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 12px;
      box-shadow: 0 12px 28px rgba(28, 41, 56, 0.08);
    }

    nav {
      padding: 14px;
      display: grid;
      gap: 10px;
    }

    .nav-title {
      padding: 5px 4px 2px;
      color: var(--muted);
      font-size: 0.78rem;
      font-weight: 800;
      letter-spacing: 0.08em;
    }

    .nav-title.model {
      margin-top: 8px;
      padding-top: 16px;
      border-top: 1px solid var(--line);
    }

    .module-btn,
    .module-link {
      width: 100%;
      text-align: left;
      border: 1px solid var(--line);
      border-radius: 10px;
      background: #eef3f7;
      color: var(--ink);
      padding: 13px 14px;
      font: inherit;
      font-weight: 800;
      line-height: 1.35;
      text-decoration: none;
      display: block;
      transition: 0.18s ease;
    }

    .module-btn {
      cursor: pointer;
    }

    .module-btn span,
    .module-link span {
      display: block;
      margin-top: 2px;
      font-weight: 500;
      color: var(--muted);
      font-size: 0.88rem;
    }

    .module-btn:hover,
    .module-link:hover {
      border-color: var(--accent);
      transform: translateY(-1px);
    }

    .module-btn.active {
      background: var(--accent);
      color: #ffffff;
      border-color: var(--accent);
    }

    .module-btn.active span {
      color: #e8fbff;
    }

    .module-link {
      background: #eaf6f7;
      border-color: #b8dfe3;
    }

    .module-link:hover {
      background: #dff1f3;
      border-color: var(--accent);
    }

    .viewer {
      height: calc(100vh - 125px);
      min-height: 760px;
      overflow: hidden;
    }

    .viewer iframe {
      width: 100%;
      height: 100%;
      border: 0;
      display: block;
      background: #ffffff;
      border-radius: 12px;
    }

    @media (max-width: 900px) {
      .layout {
        grid-template-columns: 1fr;
      }

      .viewer {
        height: 900px;
      }
    }
  </style>
</head>

<body>

  <main>

    <header>
      <h1>海洋工程工具箱 <span lang="en">Ocean Engineering Toolbox</span></h1>
      <p class="subtitle">
        波浪計算、潮汐分析、資料分析、座標轉換與數值模式教學整理。
      </p>
    </header>

    <section class="layout">

      <aside class="panel">

        <nav aria-label="modules">

          <div class="nav-title">
            工具箱
          </div>

          <button
            class="module-btn active"
            data-src="modules/wave-generator.html">
            規則波產生器
            <span>Regular wave generator</span>
          </button>

          <button
            class="module-btn"
            data-src="modules/spectrum-generator.html">
            不規則波與波譜產生
            <span>Irregular wave / spectrum generator</span>
          </button>

          <button
            class="module-btn"
            data-src="modules/wave-analysis.html">
            零上／下切與頻譜分析
            <span>Zero crossing / spectral analysis</span>
          </button>

          <button
            class="module-btn"
            data-src="modules/tidal.html">
            潮汐分析工具
            <span>Tidal analysis / harmonic / sea-level trend</span>
          </button>

          <button
            class="module-btn"
            data-src="modules/coordinate-converter.html">
            XYZ 座標轉換
            <span>WGS84 / TWD97 coordinate converter</span>
          </button>

          <div class="nav-title model">
            數值模式
          </div>

          <a
            class="module-link"
            href="opendrift/">
            OpenDrift / OpenOil
            <span>Particle tracking / oil spill modeling</span>
          </a>

        </nav>

      </aside>

      <section class="panel viewer">

        <iframe
          id="moduleFrame"
          src="modules/wave-generator.html"
          title="Engineering toolbox module">
        </iframe>

      </section>

    </section>

  </main>

  <script>
    const frame = document.getElementById("moduleFrame");

    document.querySelectorAll(".module-btn").forEach(btn => {

      btn.addEventListener("click", () => {

        document.querySelectorAll(".module-btn").forEach(b => {
          b.classList.remove("active");
        });

        btn.classList.add("active");

        frame.src = btn.dataset.src;

      });

    });
  </script>

</body>

</html>
