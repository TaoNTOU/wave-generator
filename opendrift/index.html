<!doctype html>
<html lang="zh-Hant">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>OpenDrift / OpenOil | Tutorial & Case Studies</title>

  <style>
    :root {
      --ink: #17212b;
      --muted: #637083;
      --line: #d8e0ea;
      --panel: #ffffff;
      --bg: #f5f7fa;

      --accent: #214d78;
      --accent-dark: #173a5f;
      --accent-soft: #eef4fb;

      font-family:
        "Segoe UI",
        "Noto Sans TC",
        "Microsoft JhengHei",
        system-ui,
        sans-serif;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: var(--bg);
      color: var(--ink);
    }

    main {
      width: min(1500px, calc(100% - 28px));
      margin: 0 auto;
      padding: 24px 0 32px;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: end;
      gap: 20px;
      margin-bottom: 16px;
    }

    h1 {
      margin: 0 0 6px;
      font-size: clamp(1.8rem, 3vw, 2.8rem);
      line-height: 1.08;
      color: var(--accent-dark);
    }

    .subtitle {
      margin: 0;
      color: var(--muted);
    }

    .home-link {
      display: inline-block;
      padding: 9px 14px;
      border: 1px solid var(--line);
      border-radius: 9px;
      background: #ffffff;
      color: var(--accent-dark);
      text-decoration: none;
      font-size: 0.92rem;
      font-weight: 700;
      white-space: nowrap;
    }

    .home-link:hover {
      border-color: var(--accent);
      background: var(--accent-soft);
    }

    .layout {
      display: grid;
      grid-template-columns: 310px 1fr;
      gap: 16px;
      align-items: start;
    }

    .panel {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 12px;
      box-shadow: 0 12px 28px rgba(28, 41, 56, 0.08);
    }

    aside {
      position: sticky;
      top: 14px;
    }

    nav {
      padding: 14px;
      display: grid;
      gap: 10px;
    }

    .nav-title {
      padding: 5px 4px 2px;
      color: var(--muted);
      font-size: 0.78rem;
      font-weight: 800;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .case-btn {
      width: 100%;
      text-align: left;
      border: 1px solid var(--line);
      border-radius: 10px;
      background: #eef3f7;
      color: var(--ink);
      padding: 13px 14px;
      cursor: pointer;
      font: inherit;
      font-weight: 800;
      line-height: 1.35;
      transition: 0.18s ease;
    }

    .case-btn:hover {
      border-color: var(--accent);
      transform: translateY(-1px);
    }

    .case-btn span {
      display: block;
      margin-top: 3px;
      color: var(--muted);
      font-size: 0.84rem;
      font-weight: 500;
      line-height: 1.4;
    }

    .case-btn.active {
      background: var(--accent);
      border-color: var(--accent);
      color: #ffffff;
    }

    .case-btn.active span {
      color: #e7f1fb;
    }

    .case-number {
      display: inline-block;
      margin-bottom: 3px;
      font-size: 0.76rem;
      letter-spacing: 0.05em;
      opacity: 0.75;
    }

    .nav-footer {
      margin-top: 6px;
      padding: 13px 5px 2px;
      border-top: 1px solid var(--line);
      color: var(--muted);
      font-size: 0.82rem;
      line-height: 1.5;
    }

    .viewer {
      height: calc(100vh - 120px);
      min-height: 820px;
      overflow: hidden;
    }

    .viewer iframe {
      width: 100%;
      height: 100%;
      border: 0;
      display: block;
      background: #ffffff;
      border-radius: 12px;
    }

    @media (max-width: 900px) {

      header {
        display: block;
      }

      .home-link {
        margin-top: 12px;
      }

      .layout {
        grid-template-columns: 1fr;
      }

      aside {
        position: static;
      }

      nav {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }

      .nav-title,
      .nav-footer {
        grid-column: 1 / -1;
      }

      .viewer {
        height: 900px;
      }
    }

    @media (max-width: 600px) {

      nav {
        grid-template-columns: 1fr;
      }

    }
  </style>
</head>

<body>

  <main>

    <header>

      <div>

        <h1>
          OpenDrift / OpenOil
        </h1>

        <p class="subtitle">
          模型安裝、基礎驗證、OpenOil、水平擴散與 Delft3D 實際案例整理
        </p>

      </div>

      <a
        class="home-link"
        href="../">
        ← 返回海洋工程工具箱
      </a>

    </header>


    <section class="layout">

      <!-- 左側 Case 選單 -->

      <aside class="panel">

        <nav aria-label="OpenDrift cases">

          <div class="nav-title">
            Tutorial & Case Studies
          </div>


          <button
            class="case-btn active"
            data-src="Case0_OpenDrift_本機安裝教學_Windows.html">

            <span class="case-number">CASE 00</span>

            OpenDrift 本機安裝

            <span>
              Windows / Miniforge / Git / Environment Setup
            </span>

          </button>


          <button
            class="case-btn"
            data-src="Case1_OpenDrift_Constant_Current_整理.html">

            <span class="case-number">CASE 01</span>

            Constant Current

            <span>
              固定流場、粒子漂移與理論距離驗證
            </span>

          </button>


          <button
            class="case-btn"
            data-src="Case2_OpenOil_moving to coast.html">

            <span class="case-number">CASE 02</span>

            OpenOil Moving to Coast

            <span>
              海流、風場、油污漂移與 Weathering
            </span>

          </button>


          <button
            class="case-btn"
            data-src="Case3_OpenDrift_backandforth.html">

            <span class="case-number">CASE 03</span>

            Forward / Backward

            <span>
              正向漂移、反向追蹤與數值驗證
            </span>

          </button>


          <button
            class="case-btn"
            data-src="Case4_OpenDrift_Kaohsiung_case_selfmade.html">

            <span class="case-number">CASE 04</span>

            Kaohsiung + Delft3D

            <span>
              自製 Landmask、Delft3D 流場與粒子追蹤
            </span>

          </button>


          <button
            class="case-btn"
            data-src="Case5_OpenDrift_OpenOil_Analysis with K.html">

            <span class="case-number">CASE 05</span>

            Horizontal Diffusion

            <span>
              K、Timestep、OceanDrift 與 OpenOil 控制試驗
            </span>

          </button>


          <div class="nav-footer">
            後續新增 Case 時，只需新增 HTML，並在此選單增加一個按鈕即可。
          </div>

        </nav>

      </aside>


      <!-- 右側 Case 顯示區 -->

      <section class="panel viewer">

        <iframe
          id="caseFrame"
          src="Case0_OpenDrift_本機安裝教學_Windows.html"
          title="OpenDrift Case">
        </iframe>

      </section>

    </section>

  </main>


  <script>

    const frame = document.getElementById("caseFrame");

    const buttons = document.querySelectorAll(".case-btn");

    buttons.forEach(btn => {

      btn.addEventListener("click", () => {

        buttons.forEach(b => {
          b.classList.remove("active");
        });

        btn.classList.add("active");

        frame.src = btn.dataset.src;

        window.scrollTo({
          top: 0,
          behavior: "smooth"
        });

      });

    });

  </script>

</body>

</html>
