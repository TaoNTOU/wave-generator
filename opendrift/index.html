<!doctype html>
<html lang="zh-Hant">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>OpenDrift / OpenOil Tutorial</title>

  <style>
    :root {
      --bg:#f4f7fb;
      --panel:#ffffff;
      --text:#1f2937;
      --muted:#64748b;
      --line:#dbe3ee;
      --accent:#147a97;
      --accent-dark:#0b526b;
    }

    * {
      box-sizing:border-box;
    }

    body {
      margin:0;
      background:var(--bg);
      color:var(--text);
      font-family:"Segoe UI","Noto Sans TC","Microsoft JhengHei",sans-serif;
    }

    .layout {
      display:grid;
      grid-template-columns:280px 1fr;
      min-height:100vh;
    }

    /* 左側選單 */

    .sidebar {
      height:100vh;
      position:sticky;
      top:0;
      background:#ffffff;
      border-right:1px solid var(--line);
      padding:20px 14px;
      overflow-y:auto;
    }

    .sidebar h2 {
      margin:0;
      color:var(--accent-dark);
      font-size:1.35rem;
    }

    .sidebar-subtitle {
      margin:4px 0 20px;
      color:var(--muted);
      font-size:.82rem;
    }

    .case-btn {
      width:100%;
      border:0;
      background:transparent;
      text-align:left;
      padding:12px 10px;
      margin-bottom:4px;
      border-radius:9px;
      cursor:pointer;
      font:inherit;
      color:var(--text);
      font-weight:700;
      line-height:1.35;
    }

    .case-btn span {
      display:block;
      margin-top:3px;
      font-size:.76rem;
      font-weight:500;
      color:var(--muted);
    }

    .case-btn:hover {
      background:#edf5f8;
    }

    .case-btn.active {
      background:var(--accent);
      color:#ffffff;
    }

    .case-btn.active span {
      color:#e8f8fc;
    }

    .divider {
      border-top:1px solid var(--line);
      margin:14px 0;
    }

    .toolbox-link {
      display:block;
      color:var(--muted);
      text-decoration:none;
      font-size:.85rem;
      font-weight:700;
      padding:8px 2px;
    }

    .toolbox-link:hover {
      color:var(--accent);
    }

    /* 右側 */

    .viewer {
      height:100vh;
      overflow:hidden;
      background:var(--bg);
    }

    .viewer iframe {
      width:100%;
      height:100%;
      border:0;
      display:block;
      background:#ffffff;
    }

    @media(max-width:850px) {

      .layout {
        grid-template-columns:1fr;
      }

      .sidebar {
        height:auto;
        position:relative;
        border-right:0;
        border-bottom:1px solid var(--line);
      }

      .viewer {
        height:900px;
      }

    }
  </style>
</head>

<body>

  <div class="layout">

    <!-- 左側固定選單 -->

    <aside class="sidebar">

      <h2>OpenDrift / OpenOil</h2>

      <div class="sidebar-subtitle">
        Tutorial & Case Studies
      </div>

      <button
        class="case-btn active"
        data-src="overview.html">
        Overview
        <span>案例總覽</span>
      </button>

      <button
        class="case-btn"
        data-src="Case0_OpenDrift_本機安裝教學_Windows.html">
        Case 0｜本機安裝
        <span>Windows / Miniforge / Git</span>
      </button>

      <button
        class="case-btn"
        data-src="Case1_OpenDrift_Constant_Current_整理.html">
        Case 1｜Constant Current
        <span>固定流場與理論驗證</span>
      </button>

      <button
        class="case-btn"
        data-src="Case2_OpenOil_moving to coast.html">
        Case 2｜Moving to Coast
        <span>OpenOil 漂移與 Weathering</span>
      </button>

      <button
        class="case-btn"
        data-src="Case3_OpenDrift_backandforth.html">
        Case 3｜Forward / Backward
        <span>Forward / Backward tracking</span>
      </button>

      <button
        class="case-btn"
        data-src="Case4_OpenDrift_Kaohsiung_case_selfmade.html">
        Case 4｜Kaohsiung + Delft3D
        <span>Landmask / Delft3D</span>
      </button>

      <button
        class="case-btn"
        data-src="Case5_OpenDrift_OpenOil_Analysis with K.html">
        Case 5｜Horizontal Diffusion
        <span>K / Timestep / OpenOil</span>
      </button>

      <div class="divider"></div>

      <a class="toolbox-link" href="../">
        ← 返回海洋工程工具箱
      </a>

    </aside>


    <!-- 右側內容 -->

    <main class="viewer">

      <iframe
        id="caseFrame"
        src="overview.html"
        title="OpenDrift Tutorial">
      </iframe>

    </main>

  </div>


  <script>

    const frame = document.getElementById("caseFrame");

    const buttons = document.querySelectorAll(".case-btn");

    buttons.forEach(btn => {

      btn.addEventListener("click", () => {

        buttons.forEach(b => {
          b.classList.remove("active");
        });

        btn.classList.add("active");

        frame.src = btn.dataset.src;

      });

    });

  </script>

</body>

</html>
